name: Build and publish

# Every push to main exports the game for Web, Windows and Linux, deploys the
# web build to GitHub Pages and refreshes the "latest" release downloads.
# Pull requests only run the exports, as a check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-win-linux

      - name: Install Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz \
            templates/version.txt \
            templates/web_nothreads_release.zip \
            templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe \
            templates/windows_release_x86_64_console.exe \
            -d "$dest"
          rm godot.zip templates.tpz

      - name: Import assets
        run: ~/godot/godot --headless --path . --import

      - name: Export
        run: |
          mkdir -p build/web build/windows build/linux
          touch build/.gdignore
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/dumbgame.exe
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/dumbgame.x86_64
          test -s build/web/index.wasm
          test -s build/windows/dumbgame.exe
          test -s build/linux/dumbgame.x86_64
          (cd build/windows && zip -q -r ../dumbgame-windows.zip .)
          (cd build/linux && zip -q -r ../dumbgame-linux.zip .)
          (cd build/web && zip -q -r ../dumbgame-web.zip .)

      - name: Upload web build for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publish "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            build/dumbgame-windows.zip build/dumbgame-linux.zip build/dumbgame-web.zip \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Play in the browser: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

  deploy:
    if: github.event_name != 'pull_request'
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
